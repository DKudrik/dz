apiVersion: apps/v1
kind: Deployment
metadata:
  name: convverter-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: converter
  template:
    metadata: 
      labels:
        app: converter
    spec:
      containers:
        - name: converter
          image: antonlarichev/conv-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
      envFrom:
        - configMapRef:
          name: demo-config
        - secretRef:
          name: conv-api-secret
      volumeMounts:
        - name: test
          mountPath: /etc/test
          readOnly: true
    volumes:
      - name: test
        configMap:
          name: demo-config
