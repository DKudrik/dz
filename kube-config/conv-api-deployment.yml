apiVersion: apps/v1
kind: Deployment
metadata:
  name: conv-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
    template:
      metadata:
        labels:
          app: backend
    spec:
      containers:
        - name: conv-api
          image: antonlarichev/conb-api:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containers: 3000
          resources:
            limits:
              memory: "500Mi"
              cpu: "200m"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: conv-api-secret
                  key: DATABASE_URL
          volumeMounts: 
            - name: api-storage
              mountPath: /opt/app/uploads
    volumes:
    - name: api-storage
      persistentVolumeClaim:
        claimName: api-pvc

